# Tool configuration only. Dependencies are pinned in requirements*.txt (see `make lock`).
[project]
name = "wind-forecast-monitor-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
