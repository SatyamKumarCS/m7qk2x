<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3d2e" />
    <script>
      // Apply the saved theme before first paint, so dark mode never flashes light.
      try {
        var s = JSON.parse(localStorage.getItem('wfm-settings') || '{}')
        var dark =
          s.theme === 'dark' ||
          (s.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.density = s.density || 'comfortable'
        document.documentElement.dataset.motion = s.motion || 'full'
      } catch (e) {}
    </script>
    <title>Wind Forecast Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
